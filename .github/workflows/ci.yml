name: CI

# Third-party action pinning policy
# ---------------------------------
# Every `uses:` below is pinned to a full 40-character commit SHA, because a tag
# (even `v4`) is a mutable pointer the action's owner can move — pinning one
# means trusting them not to, forever. The trailing comment records which
# release each SHA was, so the pin stays readable and bumpable.
#
# Resolved and verified against the GitHub API at pin time:
#   actions/checkout                 fbc6f39 = tag v5.0.0
#   Swatinem/rust-cache              c193711 = tag v2.9.1
#   EmbarkStudios/cargo-deny-action  3c63498 = tag v2.1.1
#   dtolnay/rust-toolchain           4cda84d = head of the `stable` branch on
#                                    2026-07-16. This action publishes no
#                                    release tags for its toolchain branches;
#                                    at this commit the `toolchain` input
#                                    defaults to `stable`, which is what the
#                                    jobs that do not pass it rely on.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Least privilege: no job here writes to the repository, publishes a package, or
# comments on a PR, so read access to the contents is the whole requirement.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: cargo fmt
        run: cargo fmt --all --check

      # Feature selection policy
      # ------------------------
      # These gates run on the *default* feature set, not `--all-features`, and
      # that is deliberate. The workspace has exactly one non-default feature,
      # `cuda` (on `rerobot-train`, re-exported by `rerobot-cli`), and enabling it
      # requires the NVIDIA CUDA toolkit at build time because `candle-kernels`
      # compiles PTX from source. None of the three runners here has one, so
      # `--all-features` would turn every gate red on a machine that could never
      # be right.
      #
      # The cost of dropping `--all-features` is that a future feature could go
      # untested by accident, so the "no CUDA in a default build" step below
      # asserts the split is real rather than assumed, and any feature added
      # later has to be named here explicitly.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets --locked

      # The other half of the feature policy: a default build must not link the
      # CUDA backend. If `cuda` ever becomes a default feature, or a dependency
      # starts enabling `candle-core/cuda` transitively, every runner above would
      # suddenly need `nvcc` — this catches that in one cheap command instead.
      - name: no CUDA backend in a default build
        if: runner.os == 'Linux'
        run: |
          tree="$(cargo tree --workspace --locked --edges normal --prefix none)"
          for crate in cudarc candle-kernels ug-cuda; do
            if printf '%s\n' "$tree" | grep -q "^$crate "; then
              echo "the default build pulled in $crate; --features cuda must stay opt-in"
              exit 1
            fi
          done
          # And the feature does exist, so this check is testing something.
          cargo metadata --format-version 1 --no-deps \
            | grep -q '"cuda":\["candle-core/cuda","candle-nn/cuda"\]'

      # The `cfg(windows)` half of the `shutil.which` port cannot run on the
      # machine it was written on, so `windows-latest` is where PATHEXT
      # expansion, the current-directory rule, and `ntpath.split` are actually
      # exercised. Re-running with NoDefaultCurrentDirectoryInExePath set takes
      # the other branch of `NeedCurrentDirectoryForExePath`: the Win32 call is
      # made rather than reimplemented, so this proves neither branch breaks
      # resolution. docs/compatibility.md records that it does not pin *which*
      # branch was taken.
      - name: cargo test (Windows, no default current directory)
        if: runner.os == 'Windows'
        env:
          NoDefaultCurrentDirectoryInExePath: '1'
        run: cargo test --workspace --all-targets --locked

      - name: cargo test --doc
        run: cargo test --workspace --doc

      # Doctests run the code in the docs; they say nothing about whether the docs
      # themselves resolve. A broken intra-doc link, an ambiguous one, or a private
      # type named in a public signature is a rustdoc warning and never a test
      # failure, so without this step the documentation can rot while every gate
      # stays green. `--no-deps` keeps it to this workspace's own output.
      - name: cargo doc (strict)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      - name: cargo build --release
        run: cargo build --workspace --release --locked

  msrv:
    # The minimum supported Rust version is a published promise: `rust-version`
    # in Cargo.toml is what `cargo install` enforces for users. Building on it is
    # the only thing that makes the claim true.
    name: MSRV (rust-version from Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Read the version out of the manifest rather than repeating it here: a
      # hardcoded toolchain would let the two drift and quietly stop testing the
      # version users are promised.
      - name: Read the declared MSRV
        id: msrv
        run: |
          version="$(grep -m1 -E '^rust-version[[:space:]]*=' Cargo.toml \
                     | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ -z "$version" ]; then
            echo "no rust-version in the workspace Cargo.toml" >&2
            exit 1
          fi
          echo "declared MSRV: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install the declared MSRV toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Confirm the toolchain in use is the declared one
        run: |
          rustc --version
          rustc --version | grep -q '${{ steps.msrv.outputs.version }}'

      # --locked, because the MSRV is a property of the *locked* tree: a fresh
      # resolve could pull a newer dependency with a higher floor and pass here
      # while failing for anyone installing from the lockfile.
      #
      # Default features, for the reason given in the `gates` job: `--features
      # cuda` needs a CUDA toolkit this runner does not have. The MSRV promise
      # this asserts is therefore the one for a default install, which is what
      # `cargo install rerobot-cli` performs; the CUDA build's floor is whatever
      # `cudarc` and `candle-kernels` require and is not promised here.
      - name: cargo build (MSRV)
        run: cargo build --workspace --locked

      - name: cargo test (MSRV)
        run: cargo test --workspace --all-targets --locked

  package:
    name: package publishable crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # Cargo's built-in verifier resolves normalized path dependencies from
      # crates.io, where the unreleased sibling APIs do not exist yet. Build the
      # normal archives, then test those exact archives against extracted sibling
      # archives in a temporary local patch workspace.
      - name: package and verify exact archives
        run: python3 tools/verify_packages.py

  smoke:
    name: lerobot-* smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build executables
        run: cargo build --workspace --release --locked

      - name: lerobot-info runs for real
        run: |
          ./target/release/lerobot-info
          out="$(./target/release/lerobot-info)"
          printf '%s\n' "$out" | grep -q '^- LeRobot version:'
          printf '%s\n' "$out" | grep -q '^- Platform:'
          printf '%s\n' "$out" | grep -q '^- FFmpeg version:'
          printf '%s\n' "$out" | grep -qx -- '- Using GPU in script?: <fill in>'
          printf '%s\n' "$out" | grep -q "^- lerobot scripts: \['lerobot-calibrate', "
          # Upstream's 15 get_sys_info keys, and nothing else.
          test "$(printf '%s\n' "$out" | wc -l)" -eq 15

      - name: lerobot-info still finds ffmpeg with PATH removed
        run: |
          # CPython 3.12 `shutil.which` falls back to `os.confstr("CS_PATH")`,
          # or `os.defpath`, when PATH is absent from the environment. A port
          # that returned None here would report an installed ffmpeg as missing
          # for every process started with a scrubbed environment.
          # The precondition has to be "ffmpeg is on the *fallback* path", not
          # "ffmpeg is on PATH". `command -v ffmpeg` is satisfied by a Homebrew,
          # Nix or user-local install that `CS_PATH` knows nothing about, and this
          # step then asserts a fallback that genuinely cannot succeed. That
          # combination was observed on a developer machine.
          #
          # So probe the same directories CPython would: `confstr("CS_PATH")` if
          # getconf can report it, else `os.defpath`, which is `:/bin:/usr/bin`.
          fallback="$(getconf PATH 2>/dev/null || true)"
          if [ -z "$fallback" ]; then
            fallback="/bin:/usr/bin"
          fi
          found=""
          IFS=':'
          for dir in $fallback; do
            [ -n "$dir" ] || continue
            if [ -x "$dir/ffmpeg" ]; then
              found="$dir/ffmpeg"
              break
            fi
          done
          unset IFS
          if [ -z "$found" ]; then
            # ffmpeg may still be on PATH, but not where the fallback looks, so the
            # assertion below would be asserting something untrue of this runner.
            # The unit test `an_unset_search_path_falls_back_to_the_system_default`
            # covers the fallback logic itself with a synthetic path.
            echo "::warning::no ffmpeg under the CS_PATH fallback ($fallback); skipping the PATH-less probe"
            exit 0
          fi
          echo "ffmpeg is on the fallback path at $found"
          out="$(env -u PATH ./target/release/lerobot-info)"
          printf '%s\n' "$out" | grep -q '^- FFmpeg version:'
          if printf '%s\n' "$out" | grep -qx -- '- FFmpeg version: N/A'; then
            echo "PATH-less run reported ffmpeg absent; the CS_PATH fallback is not working"
            printf '%s\n' "$out"
            exit 1
          fi

      - name: lerobot-info reports no compatibility status
        run: |
          # Port status belongs in --help and docs/compatibility.md; this report
          # exists to be comparable with upstream's.
          scripts="$(./target/release/lerobot-info | grep '^- lerobot scripts:')"
          for label in partial unimplemented hardware-gated implemented; do
            if printf '%s\n' "$scripts" | grep -q "$label"; then
              echo "the scripts list leaked port status: $scripts"; exit 1
            fi
          done

      - name: lerobot-train performs a real one-step ACT training run
        run: |
          parent="$(mktemp -d)"
          out="$parent/run"
          ./target/release/lerobot-train \
            --dataset.repo_id=rerobot/state_only_slice \
            --dataset.root=crates/rerobot-train/tests/fixtures/state_only \
            --output_dir="$out" --policy.type=act --steps=1 --batch_size=2 \
            --policy.chunk_size=2 --policy.n_action_steps=2 --policy.dim_model=32 \
            --policy.n_heads=4 --policy.dim_feedforward=64 \
            --policy.n_encoder_layers=1 --policy.n_decoder_layers=1 \
            --policy.n_vae_encoder_layers=1 --policy.latent_dim=8 > train.log
          grep -q '^End of training$' train.log
          grep -q '^step:1 loss:' train.log
          test -s "$out/checkpoints/000001/pretrained_model/model.safetensors"
          test -s "$out/checkpoints/000001/training_state/optimizer_state.safetensors"
          test -s "$out/checkpoints/000001/training_state/rng_state.safetensors"
          ./target/release/lerobot-rollout \
            --policy.path="$out/checkpoints/000001/pretrained_model" \
            --dataset.root=crates/rerobot-train/tests/fixtures/state_only \
            --steps=3 > rollout.log
          grep -q '^frame:0 action:' rollout.log
          grep -q '^frame:1 action:' rollout.log
          grep -q '^frame:2 action:' rollout.log
          grep -q 'queried:true' rollout.log
          grep -q 'queried:false' rollout.log

      - name: --help and --version work for every entry point
        run: |
          for bin in ./target/release/lerobot-*; do
            case "$bin" in *.d) continue;; esac
            "$bin" --help > /dev/null
            "$bin" --version > /dev/null
            "$bin" --help | grep -q 'https://github.com/k1000dai/Rerobot'
          done

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
