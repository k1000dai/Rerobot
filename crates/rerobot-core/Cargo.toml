[package]
name = "rerobot-core"
description = "Pure-Rust LeRobot core compatibility: metadata IO, processors, rollout, types, and system info."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
indexmap.workspace = true
log.workspace = true
num-bigint.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-general-category.workspace = true

[dev-dependencies]
# The differential oracle for `byte_count`: `tests/byte_count.rs` checks the
# public arithmetic against `BigUint` computed independently of the type under
# test, so the imported name is deliberately not the crate's own re-export.
num-bigint.workspace = true

[lints.rust]
missing_docs = "warn"
