[package]
name = "rerobot-train"
description = "Pure-Rust LeRobot ACT training: local state/action and embedded-image dataset reading, the ACT tensor model, AdamW, and the upstream checkpoint layout."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
default = []

# Compile candle's CUDA backend, which makes `--policy.device=cuda` selectable.
#
# It is off by default and always will be: turning it on requires the NVIDIA
# CUDA toolkit (`nvcc`) at build time, because `candle-kernels` compiles PTX from
# source, and it drags `cudarc` and `ug-cuda` into the tree. A default `cargo
# build` on macOS, Windows or a GPU-less Linux box must not need any of that.
#
# This is why the CI gates name their features explicitly instead of passing
# `--all-features`: `--all-features` would turn this on for every runner, none of
# which has a CUDA toolkit. See `.github/workflows/ci.yml`.
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
rerobot-core.workspace = true
indexmap.workspace = true
num-bigint.workspace = true

# The tensor runtime. Pinned exactly: this crate reimplements PyTorch operator
# semantics (`nn.MultiheadAttention`'s packed projection, `nn.LayerNorm`'s eps,
# AdamW's update order) on top of it, and a minor bump that changed a reduction
# or a broadcast rule would move the numbers the golden tests pin.
#
# Default features only, which for candle means CPU: no CUDA, no Metal, no MKL,
# no Accelerate. The optional `cuda` feature below is the single exception.
candle-core = { version = "=0.9.1", default-features = false }
candle-nn = { version = "=0.9.1", default-features = false }

# Reading the dataset's parquet files. `default-features = false` drops the
# async runtime, the CLI helpers and the object-store integration; `arrow` is the
# reader this crate uses and `snap` is the codec pyarrow writes by default, which
# is what the committed fixture is compressed with.
arrow-array = "=56.2.0"
arrow-schema = "=56.2.0"
parquet = { version = "=56.2.0", default-features = false, features = ["arrow", "snap"] }
# LeRobot v3 image columns embed PNG/JPEG bytes in Arrow. Decode them natively;
# no Python, PyTorch, ffmpeg, or other runtime is involved. Keep the format set
# deliberately narrow and portable.
image = { version = "=0.25.6", default-features = false, features = ["jpeg", "png"] }

[dev-dependencies]
# The tests build deliberately malformed parquet files -- inverted episode ranges,
# oversized row counts -- to prove the reader refuses them rather than panicking.
# Writing one needs the same arrow stack the reader reads with, at the same pins, so
# a fixture cannot be malformed in a way the reader would never see.
arrow-array = "=56.2.0"
arrow-schema = "=56.2.0"
parquet = { version = "=56.2.0", default-features = false, features = ["arrow", "snap"] }
# Same reasoning for the camera column: `tests/embedded_image.rs` encodes the PNG and
# JPEG cells it feeds the decoder, and `examples/make_embedded_image_fixture.rs` writes
# the committed fixture, both at the pin the decoder itself is built against.
image = { version = "=0.25.6", default-features = false, features = ["jpeg", "png"] }

[lints.rust]
missing_docs = "warn"
