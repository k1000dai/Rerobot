# cargo-deny configuration. Run with `cargo deny check`.
#
# Rerobot is Apache-2.0 (matching upstream LeRobot) and keeps its dependency
# tree deliberately small, so the policy here is strict on purpose: a new
# dependency should be a conscious decision, not a transitive surprise.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Candle 0.9.1 is the newest release that builds on the declared Rust 1.85
# floor. Its `gemm` dependency uses `paste`; RUSTSEC-2024-0436 records that the
# macro crate is archived, not a vulnerability, and offers no safe upgrade.
# Remove this exception when Candle can move without raising the MSRV.
ignore = ["RUSTSEC-2024-0436"]

[licenses]
version = 2
# Permissive licenses only. Rerobot ships Apache-2.0 binaries; anything
# copyleft or unclear needs an explicit discussion before it lands.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # A public-domain dedication, so permissive in the sense this list cares about.
    # `tiny-keccak` carries it, reached only as a compile-time proc-macro input
    # through `ahash`'s `const-random`, which Arrow's hashing depends on. Nothing
    # under this licence is linked into a shipped binary.
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Nothing is banned outright yet. Candidates if they ever appear transitively:
# heavyweight async runtimes and anything pulling in a Python interpreter, both
# of which would undercut the "pure Rust, no sidecar" property.
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
